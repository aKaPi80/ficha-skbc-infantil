<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ficha SKBC Infantil">
  <link rel="apple-touch-icon" href="logo.png">
  <title>Ficha Infantil SKBC</title>
  <script>
    const target = `https://skbc.vercel.app/ficha-legacy${window.location.search || ""}`;
    window.location.replace(target);
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      align-items: center;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    main {
      display: grid;
      gap: 16px;
      max-width: 420px;
    }
    img {
      background: #fff;
      border-radius: 999px;
      height: 96px;
      margin: 0 auto;
      object-fit: contain;
      padding: 6px;
      width: 96px;
    }
    h1 { font-size: 26px; margin: 0; }
    p { color: #94a3b8; margin: 0; }
    a {
      background: #2563eb;
      border-radius: 10px;
      color: #fff;
      display: inline-block;
      font-weight: 800;
      padding: 14px 18px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <img src="logo.png" alt="SKBC">
    <h1>Abriendo ficha infantil</h1>
    <p>Estamos cargando la ficha nueva con el mismo enlace de siempre.</p>
    <a id="fallback" href="https://skbc.vercel.app/alumnos">Abrir ficha</a>
  </main>
  <script>
    document.getElementById("fallback").href = target;
  </script>
</body>
</html>
